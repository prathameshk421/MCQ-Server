version: "3"

services:
  server:
    container_name: server
    build:
      context: ./server
    stdin_open: true
    tty: true
    working_dir: /src
    ports:
      - "8000:8000"
    volumes:
      - ./server:/src
      - run_vol:/var/run
      - cache_vol:/var/cache
      - tmp_vol:/tmp
    env_file:
      - .env.dev
    command: >
      sh -c "sh migrations.sh && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    container_name: db
    image: postgres
    env_file:
      - .env.dev

  celery-broker:
    container_name: celery-broker
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - celery_broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    container_name: celery
    restart: always
    build:
      context: ./server
    command: celery -A server worker -l info --queues=mcq-results,mcq-maintenance --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=500 --max-memory-per-child=262144
    volumes:
      - ./server:/src
    env_file:
      - .env.dev
    environment:
      - CELERY_BROKER_URL=redis://celery-broker:6379/0
    depends_on:
      db:
        condition: service_started
      celery-broker:
        condition: service_healthy

  celery-beat:
    container_name: celery-beat
    build:
      context: ./server
    command: celery -A server beat -l info
    volumes:
      - ./server:/src
    env_file:
      - .env.dev
    environment:
      - CELERY_BROKER_URL=redis://celery-broker:6379/0
    depends_on:
      db:
        condition: service_started
      celery-broker:
        condition: service_healthy


volumes:
  celery_broker_data:
  run_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  cache_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
